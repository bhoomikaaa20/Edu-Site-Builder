<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Comparison illustration">
  <rect width="400" height="300" rx="14" fill="#eef2fb"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="80" width="120" height="80" rx="10" fill="#fff" stroke="#1b1f26" stroke-width="2"/>
    <text x="100" y="115" font-size="13" fill="#1b1f26" font-weight="700">RULES</text>
    <text x="100" y="135" font-size="10" fill="#5b6470">traditional</text>

    <rect x="240" y="80" width="120" height="80" rx="10" fill="#fff" stroke="#2c5fd9" stroke-width="2"/>
    <text x="300" y="115" font-size="13" fill="#2c5fd9" font-weight="700">DATA</text>
    <text x="300" y="135" font-size="10" fill="#5b6470">AI / learning</text>

    <rect x="140" y="210" width="120" height="50" rx="10" fill="#1b1f26"/>
    <text x="200" y="240" fill="#fff" font-size="13" font-weight="700">DECISION</text>
  </g>
  <g stroke="#1b1f26" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="100" y1="160" x2="180" y2="210"/>
  </g>
  <g stroke="#2c5fd9" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="300" y1="160" x2="220" y2="210"/>
  </g>
</svg>
