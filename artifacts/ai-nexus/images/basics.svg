<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="AI Basics illustration">
  <rect width="400" height="300" rx="14" fill="#eef2fb"/>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1b1f26">
    <rect x="40" y="120" width="80" height="60" rx="10" fill="#fff" stroke="#2c5fd9"/>
    <text x="80" y="155" text-anchor="middle">DATA</text>
    <rect x="160" y="100" width="80" height="100" rx="10" fill="#1b1f26"/>
    <text x="200" y="140" text-anchor="middle" fill="#fff">MODEL</text>
    <text x="200" y="160" text-anchor="middle" fill="#cfd4dc" font-size="10">learns patterns</text>
    <rect x="280" y="120" width="80" height="60" rx="10" fill="#fff" stroke="#2c5fd9"/>
    <text x="320" y="155" text-anchor="middle">PREDICT</text>
  </g>
  <g stroke="#2c5fd9" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="150" x2="160" y2="150"/>
    <line x1="240" y1="150" x2="280" y2="150"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#2c5fd9"/>
    </marker>
  </defs>
  <text x="200" y="240" text-anchor="middle" fill="#5b6470" font-family="Inter, Arial, sans-serif" font-size="12">
    Data in → patterns out
  </text>
</svg>
